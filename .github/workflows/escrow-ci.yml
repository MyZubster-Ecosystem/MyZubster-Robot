name: Escrow CI

on:
  pull_request:
    paths:
      - "contracts/**"
      - "x402-gateway/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/escrow-ci.yml"
  push:
    branches: [main]
    paths:
      - "contracts/**"
      - "x402-gateway/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/escrow-ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run test:escrow
