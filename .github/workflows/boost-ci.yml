name: Boost CI / Lint & Test
on:
  push:
    branches: [master, main, boost-*]
  pull_request:
    branches: [master, main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; elif [ -f yarn.lock ]; then yarn --frozen-lockfile; else npm install; fi
      - name: Run tests
        run: |
          if grep -q '\"test\"' package.json; then npm test; else echo 'No test script found'; fi
