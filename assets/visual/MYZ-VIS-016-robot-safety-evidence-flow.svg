<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc"><title id="title">MyZubster Robot safety and evidence flow</title><desc id="desc">Documentation diagram showing simulation, bounded command, hardware safety gate, telemetry evidence, review, and separately verified settlement.</desc><rect width="1600" height="760" rx="32" fill="#07111f"/><text x="70" y="82" font-family="Arial,sans-serif" font-size="44" font-weight="700" fill="#ffffff">MYZUBSTER ROBOT // SAFETY + EVIDENCE FLOW</text><text x="70" y="120" font-family="Arial,sans-serif" font-size="18" fill="#55f2ff">PROTOTYPE TRACK · SIMULATE FIRST · FAIL SAFE · VERIFY EXTERNALLY</text><g fill="#0d2032" stroke="#42e8ff" stroke-width="3"><rect x="60" y="210" width="240" height="120" rx="18"/><rect x="360" y="210" width="240" height="120" rx="18"/><rect x="660" y="210" width="240" height="120" rx="18"/><rect x="960" y="210" width="240" height="120" rx="18"/><rect x="1260" y="210" width="280" height="120" rx="18"/></g><g font-family="Arial,sans-serif" text-anchor="middle" fill="#ffffff"><text x="180" y="258" font-size="23" font-weight="700">SIMULATION</text><text x="180" y="292" font-size="16" fill="#a9dce3">test behavior first</text><text x="480" y="258" font-size="23" font-weight="700">BOUNDED COMMAND</text><text x="480" y="292" font-size="16" fill="#a9dce3">explicit scope + limits</text><text x="780" y="258" font-size="23" font-weight="700">SAFETY GATE</text><text x="780" y="292" font-size="16" fill="#a9dce3">stop / reject unsafe actuation</text><text x="1080" y="258" font-size="23" font-weight="700">TELEMETRY</text><text x="1080" y="292" font-size="16" fill="#a9dce3">logs + hardware evidence</text><text x="1400" y="258" font-size="23" font-weight="700">REVIEW</text><text x="1400" y="292" font-size="16" fill="#a9dce3">reproducible acceptance</text></g><g stroke="#ff4de1" stroke-width="5"><path d="M300 270H360"/><path d="M600 270H660"/><path d="M900 270H960"/><path d="M1200 270H1260"/></g><rect x="180" y="430" width="1240" height="210" rx="24" fill="#160c22" stroke="#ff4de1" stroke-width="3"/><text x="800" y="480" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#ff72e8">SEPARATE REWARD / SETTLEMENT BOUNDARY</text><text x="800" y="525" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#ffffff">verified contribution → internal MYZ accounting → funded external rail → independent verifier</text><text x="800" y="565" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#a9dce3">Robot response, PR, merge or internal credit must never self-declare an external payment final.</text><text x="800" y="605" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#55f2ff">No physical deployment is implied by this diagram. Hardware validation must be documented separately.</text><text x="800" y="710" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#ffffff">MYZ-VIS-016 · DOCUMENTATION_VISUAL · Zorgax Visual Intelligence</text></svg>